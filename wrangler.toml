name = "msa-auction"
main = "./functions/[[path]].ts"
compatibility_date = "2026-09-09"

[vars]
MAX_LISTINGS_PER_USER = "20"
MAX_IMAGES_PER_LISTING = "3"

[[d1_databases]]
binding = "DB"
database_name = "msa-auction"
database_id = "replace-with-your-d1-database-id"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "msa-auction-images"
